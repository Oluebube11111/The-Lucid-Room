<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article - The Lucid Room</title>
  <style>
    body { font-family: sans-serif; background: #0d0d0d; color: #fff; padding: 20px; max-width: 800px; margin: 0 auto; }
    a { color: #ff0055; text-decoration: none; font-weight: bold; }
    img { max-width: 100%; height: auto; border-radius: 8px; margin: 20px 0; display: block; }
    h1 { font-size: 28px; line-height: 1.3; }
    p { line-height: 1.6; color: #ccc; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to Home</a>
  <h1 id="post-title">Loading...</h1>
  <img id="post-image" src="" alt="" style="display:none;" />
  <div id="post-content"></div>

  <script>
    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const postSlug = params.get('post');
      if (!postSlug) return;

      try {
        const res = await fetch(`https://raw.githubusercontent.com/Oluebube11111/The-Lucid-Room/main/posts/${postSlug}.md`);
        if (!res.ok) return;
        const text = await res.text();

        const titleMatch = text.match(/title:\s*["']?(.*?)["']?$/m);
        const imageMatch = text.match(/image:\s*["']?(.*?)["']?$/m);
        const bodyContent = text.replace(/---[\s\S]*?---/, '').trim();

        if (titleMatch) document.getElementById('post-title').textContent = titleMatch[1];
        
        if (imageMatch && imageMatch[1]) {
          let imgPath = imageMatch[1].trim();
          // Remove leading slash if present
          if (imgPath.startsWith('/')) imgPath = imgPath.substring(1);
          
          const img = document.getElementById('post-image');
          img.src = imgPath;
          img.style.display = 'block';
        }

        // Format paragraphs nicely
        const formattedBody = bodyContent.split('\n\n').map(p => `<p>${p}</p>`).join('');
        document.getElementById('post-content').innerHTML = formattedBody;
      } catch (err) {
        console.error('Error loading article:', err);
      }
    }
    document.addEventListener('DOMContentLoaded', loadArticle);
  </script>
</body>
</html>
