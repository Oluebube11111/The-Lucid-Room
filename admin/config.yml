backend:
  name: github
  repo: Oluebube11111/The-Lucid-Room
  branch: main

media_folder: "uploads"
public_folder: "uploads"

collections:
  - name: "posts"
    label: "Posts"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Badge"
        name: "badge"
        widget: "string"
      - label: "Featured Image"
        name: "image"
        widget: "image"
      - label: "Body"
        name: "body"
        widget: "markdown"
