backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "Articles"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "badge", widget: "select", options: ["Hip Hop News", "Legal Update", "Trending Now", "Sports", "Culture"] }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Body Text", name: "body", widget: "markdown" }
